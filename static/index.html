<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Stock</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>

<body>

    <h1>Gestión de Stock</h1>

    <div class="contenedor">
        <div class="lista-productos">
            <h2>Productos</h2>

            <label for="categoria">Filtrar por categoría:</label>

            <select id="categoria">
                <option value="">Todas las categorías</option>
            </select>
            
            <table border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Categoría</th>
                    </tr>
                </thead>

                <tbody id="tabla-productos">
                </tbody>
            </table>
        </div>

        <div class="datos-producto">
            <h2>Datos del producto</h2>

            <form id="form-producto">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>

                <br><br>

                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion">

                <br><br>

                <label for="precio">Precio:</label>
                <input type="number" id="precio" step="0.01" required>

                <br><br>

                <label for="stock">Stock:</label>
                <input type="number" id="stock" required>

                <br><br>

                <label for="categoria-producto">Categoría:</label>
                <select id="categoria-producto" required>
                    <option value="">Seleccione una categoría</option>
                </select>

                <br><br>

                <button type="button" id="btn-nuevo">Nuevo</button>
                <button type="button" id="btn-agregar">Agregar</button>
                <button type="button" id="btn-modificar">Modificar</button>
                <button type="button" id="btn-eliminar">Eliminar</button>

            </form>    
        </div>
    </div>
        <button type="button" id="btn-estadisticas">Estadísticas</button>

    <section id="seccion-estadisticas" hidden>
        <h2>Estadísticas e informes</h2>
        <div id="resumen-estadisticas"></div>

        <h3>Productos por categoría</h3>
        <table>
            <thead>
                <tr>
                    <th>Categoría</th>
                    <th>Productos</th>
                </tr>
            </thead>
            <tbody id="tabla-estadisticas-categorias"></tbody>
        </table>

        <h3>Categorías sin productos</h3>
        <ul id="lista-categorias-vacias"></ul>
    </section>
    <script src="/static/app.js"></script>
</body>

</html>
